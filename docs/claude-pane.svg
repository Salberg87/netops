<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="netops in Claude Code: a conversation and the network health pane">
<rect x="0.5" y="0.5" width="919" height="499" rx="14" fill="#151816" stroke="#262B28"/>
<circle cx="22" cy="20" r="5" fill="#353B37"/>
<circle cx="38" cy="20" r="5" fill="#353B37"/>
<circle cx="54" cy="20" r="5" fill="#353B37"/>
<g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" xml:space="preserve">
<text x="420.0" y="24" fill="#8A938F" font-size="12">~/projects</text>
<rect x="20" y="52" width="520" height="34" rx="8" fill="#1A1E1C"/>
<text x="32" y="74" fill="#E7ECE9" font-size="13">&gt; my internet feels slow today — what&#x27;s going on?</text>
<text x="28" y="114" fill="#3AA391" font-size="13">●</text>
<text x="44" y="114" fill="#E7ECE9" font-size="13" font-weight="600">netops</text>
<text x="97.19999999999999" y="114" fill="#8A938F" font-size="13">diagnose</text>
<text x="44" y="134" fill="#5E6763" font-size="13">└ Mostly fine · 1 thing to look at</text>
<text x="28" y="172" fill="#E7ECE9" font-size="13">●</text>
<text x="44" y="172" fill="#E7ECE9" font-size="13">Your connection itself is fine: 14 ms to the internet</text>
<text x="44" y="192" fill="#E7ECE9" font-size="13">and DNS answers in 10 ms. What you are feeling is</text>
<text x="44" y="212" fill="#E7ECE9" font-size="13">jitter. Latency jumps to 41 ms between samples,</text>
<text x="44" y="232" fill="#E7ECE9" font-size="13">which usually means Wi-Fi interference.</text>
<text x="44" y="252" fill="#E7ECE9" font-size="13"></text>
<text x="44" y="272" fill="#E7ECE9" font-size="13">Try a cable, or sit closer to the router, then run</text>
<text x="44" y="292" fill="#E7ECE9" font-size="13">/netops again to compare.</text>
<rect x="20" y="388" width="520" height="40" rx="8" fill="none" stroke="#262B28"/>
<text x="32" y="413" fill="#8A938F" font-size="13">&gt;</text>
<rect x="46" y="399" width="8" height="17" fill="#8A938F" opacity="0.6"/>
<text x="28" y="456" fill="#3AA391" font-size="12">∿ ! · 14 ms · 1 to look at</text>
<text x="258" y="456" fill="#5E6763" font-size="12">/netops to open the pane</text>
<rect x="568" y="52" width="330" height="408" rx="10" fill="#1A1E1C" stroke="#262B28"/>
<text x="584" y="78" fill="#8A938F" font-size="12">Network health</text>
<line x1="568" y1="92" x2="898" y2="92" stroke="#262B28"/>
<text x="586" y="122" fill="#D49A2E" font-size="13" font-weight="600">! Mostly fine</text>
<text x="586" y="142" fill="#E7ECE9" font-size="12">14 ms to the internet, DNS answers</text>
<text x="586" y="160" fill="#E7ECE9" font-size="12">in 10 ms and no VPN in the way.</text>
<text x="586" y="182" fill="#5E6763" font-size="12">Checked at 09:41</text>
<text x="586" y="212" fill="#8A938F" font-size="12.5">Ping</text>
<text text-anchor="end" x="736" y="212" fill="#E7ECE9" font-size="12.5">14 ms</text>
<rect x="756.0" y="211.0" width="5.5" height="3.0" rx="1.5" fill="#3AA391"/>
<rect x="764.0" y="210.2" width="5.5" height="3.8" rx="1.5" fill="#3AA391"/>
<rect x="772.0" y="210.6" width="5.5" height="3.4" rx="1.5" fill="#3AA391"/>
<rect x="780.0" y="201.1" width="5.5" height="12.9" rx="1.5" fill="#3AA391"/>
<rect x="788.0" y="211.0" width="5.5" height="3.0" rx="1.5" fill="#3AA391"/>
<rect x="796.0" y="209.9" width="5.5" height="4.1" rx="1.5" fill="#3AA391"/>
<rect x="804.0" y="200.0" width="5.5" height="14.0" rx="1.5" fill="#3AA391"/>
<rect x="812.0" y="210.6" width="5.5" height="3.4" rx="1.5" fill="#3AA391"/>
<rect x="820.0" y="211.0" width="5.5" height="3.0" rx="1.5" fill="#3AA391"/>
<rect x="828.0" y="204.6" width="5.5" height="9.4" rx="1.5" fill="#3AA391"/>
<rect x="836.0" y="210.6" width="5.5" height="3.4" rx="1.5" fill="#3AA391"/>
<rect x="844.0" y="210.2" width="5.5" height="3.8" rx="1.5" fill="#3AA391"/>
<text x="586" y="232" fill="#8A938F" font-size="12.5">Jitter</text>
<text text-anchor="end" x="736" y="232" fill="#D49A2E" font-size="12.5">41 ms</text>
<text x="586" y="252" fill="#8A938F" font-size="12.5">DNS</text>
<text text-anchor="end" x="736" y="252" fill="#E7ECE9" font-size="12.5">10 ms</text>
<text x="586" y="272" fill="#8A938F" font-size="12.5">Down</text>
<text text-anchor="end" x="736" y="272" fill="#E7ECE9" font-size="12.5">212 Mbps</text>
<text x="586" y="292" fill="#8A938F" font-size="12.5">Up</text>
<text text-anchor="end" x="736" y="292" fill="#E7ECE9" font-size="12.5">48 Mbps</text>
<text x="586" y="328" fill="#E7ECE9" font-size="12.5" font-weight="600">Worth a look</text>
<text x="586" y="348" fill="#D49A2E" font-size="12.5">!</text>
<text x="600" y="348" fill="#E7ECE9" font-size="12.5">High jitter (41 ms)</text>
<text x="600" y="368" fill="#5E6763" font-size="12">A cable, or sitting closer to the</text>
<text x="600" y="386" fill="#5E6763" font-size="12">router, usually helps.</text>
<rect x="586" y="405" width="112" height="28" rx="8" fill="#3AA391"/>
<text x="600" y="424" fill="#0F1311" font-size="12.5" font-weight="600">Check again</text>
<rect x="710" y="405" width="104" height="28" rx="8" fill="none" stroke="#3A413D"/>
<text x="724" y="424" fill="#E7ECE9" font-size="12.5">Test speed</text>
</g>
</svg>
